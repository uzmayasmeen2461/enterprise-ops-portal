<!-- Only show toolbar + sidenav when NOT on the login page -->
@if (!isLoginPage()) {

  <!-- TOP TOOLBAR -->
  <mat-toolbar color="primary" class="app-toolbar">
    <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="app-title">{{ title }}</span>
    <span class="toolbar-spacer"></span>

    <!-- User menu -->
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item disabled>
        <mat-icon>person</mat-icon>
        <span>{{ authService.loggedInUser()?.username }}</span>
      </button>
      <button mat-menu-item disabled>
        <mat-icon>badge</mat-icon>
        <span>{{ authService.userRole() }}</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign Out</span>
      </button>
    </mat-menu>

  </mat-toolbar>

  <!-- SIDENAV LAYOUT -->
  <mat-sidenav-container class="sidenav-container">

    <mat-sidenav
      [opened]="sidenavOpen()"
      mode="side"
      class="sidenav">

      <mat-nav-list>
        @for (item of navItems; track item.route) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: false }">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>

    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet />
    </mat-sidenav-content>

  </mat-sidenav-container>

} @else {

  <!-- Login page — render with no chrome at all -->
  <router-outlet />

}
